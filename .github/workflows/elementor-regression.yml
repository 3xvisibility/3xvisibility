name: Elementor Regression

# Runs the Elementor conversion + publish/verify regression suite on every
# pull request and on every push to the main branch, so a mapping change that
# breaks 1:1 native widget output fails CI before it can be merged or shipped.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: elementor-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Elementor conversion & publish/verify tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Elementor regression suite
        run: bun run test:elementor
