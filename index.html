<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" type="image/png" />

    <!--
      Per-page head metadata is intentionally NOT hardcoded in this file.
      Every route renders its own Seo element (react-helmet-async), and the
      build-time prerender step writes the correct tags into each static
      document. Hardcoding them here would make every page advertise the
      homepage canonical URL and description (duplicate-content bug).
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "3x Visibility",
        "url": "https://3xvisibility.com/",
        "description": "Automatically mass-build local SEO, programmatic SEO, GEO sites, directories and content at scale with one-click deployment."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "3x Visibility",
        "url": "https://3xvisibility.com/"
      }
    </script>
<script>
      (function(){var t=localStorage.getItem('theme');if(t==='dark'||(! t&&window.matchMedia('(prefers-color-scheme:dark)').matches)){document.documentElement.classList.add('dark')}})();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
